# /etc/nginx/sites-available/lagenyazilim.conf
# Sertifika: certbot certonly --nginx -d lagenyazilim.com.tr -d www.lagenyazilim.com.tr
# Not: Sunucudaki diğer sitelerin vhost'larına dokunmaz; yalnızca bu iki host adını dinler.

upstream lagen_web {
    server 127.0.0.1:3490;
    keepalive 32;
}

# HTTP → HTTPS (tek adım, www'ya)
server {
    listen 80;
    listen [::]:80;
    server_name lagenyazilim.com.tr www.lagenyazilim.com.tr;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://www.lagenyazilim.com.tr$request_uri; }
}

# HTTPS www olmayan → www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lagenyazilim.com.tr;
    ssl_certificate     /etc/letsencrypt/live/lagenyazilim.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lagenyazilim.com.tr/privkey.pem;
    return 301 https://www.lagenyazilim.com.tr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lagenyazilim.com.tr;

    ssl_certificate     /etc/letsencrypt/live/lagenyazilim.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lagenyazilim.com.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lagen_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Teklif ekleri (3 × 10 MB) + form alanları; uygulamadaki 40 MB sınırıyla uyumlu
    client_max_body_size 40m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml text/xml;
    # brotli modülü kuruluysa:  brotli on; brotli_comp_level 5; brotli_types <aynı liste>;

    # Medya kütüphanesi doğrudan diskten (uygulama yükünü azaltır). Teklif ekleri (private) ASLA buradan sunulmaz.
    location /media/media/ {
        alias /var/www/lagen/shared/storage/public/media/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Next statik dosyaları: içerik adresli, uzun önbellek
    location /_next/static/ {
        proxy_pass http://lagen_web;
        proxy_set_header Host $host;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://lagen_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Uygulama istemci IP'sini bu başlıklardan okur; istemcinin gönderdiği değerler Nginx tarafından ezilir
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Gizli dosyalar
    location ~ /\.(?!well-known) { deny all; }
}
